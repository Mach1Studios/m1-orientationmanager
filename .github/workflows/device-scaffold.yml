name: Device PR Scaffold

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scaffold:
    if: >-
      ${{
        !github.event.issue.pull_request &&
        contains(github.event.comment.body, '/scaffold-device') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate scaffold files
        id: scaffold
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/scaffold_device.py

      - name: Create draft pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: ${{ steps.scaffold.outputs.commit_message }}
          branch: ${{ steps.scaffold.outputs.branch_name }}
          title: ${{ steps.scaffold.outputs.pr_title }}
          body: ${{ steps.scaffold.outputs.pr_body }}
          draft: true
          delete-branch: true

      - name: Comment with scaffold PR link
        if: ${{ steps.create_pr.outputs.pull-request-url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Draft scaffold PR created: ${{ steps.create_pr.outputs.pull-request-url }}`
            });
